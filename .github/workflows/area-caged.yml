name: Uso interno · Gold CAGED de uma área

# Chamado pelo Pipeline · CAGED, uma vez por área que ganhou mês novo (2
# áreas por vez). A silver da área já foi recortada antes, junto com a das
# outras áreas (silver-areas.yml). Aqui só a gold do CAGED:
#
#   gold-caged-consolidado         (só os anos recentes; cubos mesclados)
#   gold-territorio --base caged   (o fluxo dos anos recentes; o resto vem da gold)
#   gold-modelos --base caged      (previsão e nowcast)
#
# Nada aqui lê a RAIS, a não ser o rais_estoque_anual já publicado (nowcast).

on:
  workflow_call:
    inputs:
      area:
        type: string
        required: true
      anos_gold:
        description: "recentes ou todos (ver gold-caged-consolidado.py)"
        type: string
        default: recentes

jobs:
  gold-caged:
    uses: ./.github/workflows/gold-caged-consolidado.yml
    with:
      area: ${{ inputs.area }}
      anos: ${{ inputs.anos_gold }}
    secrets: inherit

  gold-territorio:
    uses: ./.github/workflows/gold-territorio.yml
    with:
      area: ${{ inputs.area }}
      base: caged
      anos: ${{ inputs.anos_gold }}
    secrets: inherit

  gold-modelos:
    uses: ./.github/workflows/gold-modelos.yml
    with:
      area: ${{ inputs.area }}
      base: caged
    secrets: inherit
