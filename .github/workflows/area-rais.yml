name: Interno · RAIS de uma área

# Chamado pelo pipeline-rais.yml, uma área por vez. Recorta o ano novo na
# silver da área e, só se havia ano novo, refaz a gold da RAIS:
#
#   silver-rais ─┬─ gold-rais                     (estoque, perfil, salários)
#                ├─ gold-territorio --base rais   (o estoque; o fluxo vem da gold)
#                └─ gold-modelos --base rais      (hiato e sobrevivência)
#
# Nada aqui lê o CAGED. O nowcast, que junta o estoque da RAIS com os meses do
# CAGED, é refeito pela fila do CAGED na semana seguinte.

on:
  workflow_call:
    inputs:
      area:
        type: string
        required: true
      comecar_em:
        description: "silver (verifica e recorta antes) ou gold (refaz a gold direto)"
        type: string
        default: silver

jobs:
  silver:
    if: inputs.comecar_em == 'silver'
    uses: ./.github/workflows/silver-rais.yml
    with:
      area: ${{ inputs.area }}
    secrets: inherit

  gold-rais:
    needs: silver
    # Só com ano novo na silver da área, ou começando na gold, à mão.
    if: ${{ !failure() && !cancelled() && (inputs.comecar_em == 'gold' || needs.silver.outputs.tem_novidade == 'true') }}
    uses: ./.github/workflows/gold-rais.yml
    with:
      area: ${{ inputs.area }}
    secrets: inherit

  gold-territorio:
    needs: silver
    if: ${{ !failure() && !cancelled() && (inputs.comecar_em == 'gold' || needs.silver.outputs.tem_novidade == 'true') }}
    uses: ./.github/workflows/gold-territorio.yml
    with:
      area: ${{ inputs.area }}
      base: rais
    secrets: inherit

  gold-modelos:
    needs: silver
    if: ${{ !failure() && !cancelled() && (inputs.comecar_em == 'gold' || needs.silver.outputs.tem_novidade == 'true') }}
    uses: ./.github/workflows/gold-modelos.yml
    with:
      area: ${{ inputs.area }}
      base: rais
    secrets: inherit
