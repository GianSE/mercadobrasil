name: Uso interno · Gold RAIS de uma área

# Chamado pelo Pipeline · RAIS, uma vez por área que ganhou ano novo (2 áreas
# por vez). A silver da área já foi recortada antes, junto com a das outras
# áreas (silver-areas.yml). Aqui só a gold da RAIS:
#
#   gold-rais                     (estoque, perfil, salários: só os anos novos)
#   gold-territorio --base rais   (o estoque dos anos novos; o resto vem da gold)
#   gold-modelos --base rais      (hiato dos anos novos e sobrevivência)
#
# Nada aqui lê o CAGED. O nowcast, que junta o estoque da RAIS com os meses do
# CAGED, é refeito pelo Pipeline · CAGED na semana seguinte.

on:
  workflow_call:
    inputs:
      area:
        type: string
        required: true
      anos_gold:
        description: "recentes (só os anos novos, mesclados com a gold publicada) ou todos"
        type: string
        default: recentes

jobs:
  gold-rais:
    uses: ./.github/workflows/gold-rais.yml
    with:
      area: ${{ inputs.area }}
      anos: ${{ inputs.anos_gold }}
    secrets: inherit

  gold-territorio:
    uses: ./.github/workflows/gold-territorio.yml
    with:
      area: ${{ inputs.area }}
      base: rais
      anos: ${{ inputs.anos_gold }}
    secrets: inherit

  gold-modelos:
    uses: ./.github/workflows/gold-modelos.yml
    with:
      area: ${{ inputs.area }}
      base: rais
      anos: ${{ inputs.anos_gold }}
    secrets: inherit
