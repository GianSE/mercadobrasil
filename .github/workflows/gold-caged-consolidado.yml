name: Gold CAGED consolidado por área
run-name: "Gold CAGED consolidado · ${{ inputs.area }}"

# Um parquet por tabela e por ano, mais o CAGED unificado e os cubos, a
# partir de silver-caged-<área>. Publica o espelho no repositório da silver
# da área e os cubos na gold da área.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área do recorte"
        type: choice
        options: [tec, saude, educacao, engenharia, financas, agronegocio, comercio]
        required: true
  workflow_call:
    inputs:
      area:
        type: string
        required: true

env:
  AREA: ${{ inputs.area }}
  # O spill do DuckDB vai junto: a silver de uma área grande é ~10x a de TI.
  STAGING_DIR: /mnt/staging
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  reconstruir:
    name: "Gold CAGED consolidado · ${{ inputs.area }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-actions.txt

      - name: Staging no disco grande do runner
        run: sudo mkdir -p /mnt/staging && sudo chown -R "$USER" /mnt/staging

      - name: Consolida e unifica o CAGED, publica o espelho
        working-directory: tasks-python/3-gold
        run: python gold-caged-consolidado.py
