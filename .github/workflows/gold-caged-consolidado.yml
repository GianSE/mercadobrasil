name: Etapa · Gold CAGED
run-name: "Gold CAGED consolidado · ${{ inputs.area }} · ${{ inputs.anos || 'todos' }}"

# Um parquet por tabela e por ano, mais o CAGED unificado e os cubos, a
# partir de mercadobrasil-<área>/silver-caged-<área>. Publica o espelho na mesma pasta
# da área e os cubos na gold da área.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área do recorte"
        type: choice
        options: [tec, saude, educacao, agronegocio, financas, industria, construcao, logistica, comercio, engenharia]
        required: true
      anos:
        description: "recentes = só o ano corrente e o anterior (a fila mensal); todos = refaz tudo"
        type: choice
        options: [todos, recentes]
        default: todos
  workflow_call:
    inputs:
      area:
        type: string
        required: true
      anos:
        type: string
        default: todos

env:
  AREA: ${{ inputs.area }}
  # O spill do DuckDB vai junto: a silver de uma área grande é ~10x a de TI.
  STAGING_DIR: /mnt/staging
  # Baixa a silver da área uma vez para o disco do runner, em vez de reler do
  # Hub a cada tabela (ver nuvem._no_espelho).
  ESPELHO_SILVER_LOCAL: "1"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  reconstruir:
    name: "Gold CAGED consolidado · ${{ inputs.area }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python

      - name: Staging no disco grande do runner
        run: sudo mkdir -p /mnt/staging && sudo chown -R "$USER" /mnt/staging

      - name: Consolida e unifica o CAGED, publica o espelho
        working-directory: tasks-python/3-gold
        run: python gold-caged-consolidado.py --anos ${{ inputs.anos || 'todos' }}
