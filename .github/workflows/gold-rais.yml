name: Etapa · Gold RAIS
run-name: "Gold RAIS · ${{ inputs.area }}"

# Estoque de emprego da área escolhida, a partir de mercadobrasil-<área>/silver-rais-<área>.
# Publica em Gianpedro/mercadobrasil-<área>/gold-<área>. A área só troca as listas do recorte e os
# repositórios (ver tasks-python/_utils/areas.py).

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área do recorte"
        type: choice
        options: ["escolha a área", tec, saude, educacao, agronegocio, financas, industria, construcao, logistica, comercio, engenharia]
        default: "escolha a área"
        required: true
  workflow_call:
    inputs:
      area:
        type: string
        required: true

env:
  AREA: ${{ inputs.area }}
  # O spill do DuckDB vai junto: a silver de uma área grande é ~10x a de TI.
  STAGING_DIR: /mnt/staging
  # Baixa a silver da área uma vez para o disco do runner, em vez de reler do
  # Hub a cada tabela (ver nuvem._no_espelho).
  ESPELHO_SILVER_LOCAL: "1"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  reconstruir:
    name: "Gold RAIS · ${{ inputs.area }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python

      - name: Staging no disco grande do runner
        run: sudo mkdir -p /mnt/staging && sudo chown -R "$USER" /mnt/staging

      - name: Reconstrói o estoque de emprego (RAIS)
        working-directory: tasks-python/3-gold
        run: python gold-rais.py
