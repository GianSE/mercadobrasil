name: Gold RAIS por área
run-name: "Gold RAIS · ${{ inputs.area }}"

# Estoque de emprego da área escolhida, a partir de silver-rais-<área>.
# Publica em Gianpedro/gold-analise-mercado-<área>. A área só troca as listas do recorte e os
# repositórios (ver tasks-python/_utils/areas.py).

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área do recorte"
        type: choice
        options: [tec, saude, educacao, agronegocio, financas, industria, construcao, logistica, comercio, engenharia]
        required: true
  workflow_call:
    inputs:
      area:
        type: string
        required: true

env:
  AREA: ${{ inputs.area }}
  # O spill do DuckDB vai junto: a silver de uma área grande é ~10x a de TI.
  STAGING_DIR: /mnt/staging
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  reconstruir:
    name: "Gold RAIS · ${{ inputs.area }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-actions.txt

      - name: Staging no disco grande do runner
        run: sudo mkdir -p /mnt/staging && sudo chown -R "$USER" /mnt/staging

      - name: Reconstrói o estoque de emprego (RAIS)
        working-directory: tasks-python/3-gold
        run: python gold-rais.py
