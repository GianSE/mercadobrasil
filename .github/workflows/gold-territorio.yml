name: Etapa · Gold território
run-name: "Gold território · ${{ inputs.area }} · ${{ inputs.base || 'ambas' }}"

# Mapa (RAIS + CAGED) e perfis de município da área escolhida, a partir das
# silvers da área.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área do recorte"
        type: choice
        options: ["escolha a área", tec, saude, educacao, agronegocio, financas, industria, construcao, logistica, comercio, engenharia]
        default: "escolha a área"
        required: true
      base:
        description: "Qual base refazer (a outra vem da gold publicada)"
        type: choice
        options: [ambas, caged, rais]
        default: ambas
      anos:
        description: "Com base caged: recentes refaz o fluxo só do ano corrente e do anterior; todos refaz tudo"
        type: choice
        options: [todos, recentes]
        default: todos
  workflow_call:
    inputs:
      area:
        type: string
        required: true
      base:
        type: string
        default: ambas
      anos:
        type: string
        default: todos

env:
  AREA: ${{ inputs.area }}
  # O spill do DuckDB vai junto: a silver de uma área grande é ~10x a de TI.
  STAGING_DIR: /mnt/staging
  # Baixa a silver da área uma vez para o disco do runner, em vez de reler do
  # Hub a cada tabela (ver nuvem._no_espelho).
  ESPELHO_SILVER_LOCAL: "1"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  reconstruir:
    name: "Gold território · ${{ inputs.area }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python
        with:
          requisitos: requirements-modelos.txt

      - name: Staging no disco grande do runner
        run: sudo mkdir -p /mnt/staging && sudo chown -R "$USER" /mnt/staging

      - name: Reconstrói mapa e clusters de município
        working-directory: tasks-python/3-gold
        run: python gold-territorio.py --base ${{ inputs.base || 'ambas' }} --anos ${{ inputs.anos || 'todos' }}
