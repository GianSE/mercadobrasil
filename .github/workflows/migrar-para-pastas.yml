name: Migrar para pastas por área (uso único)
run-name: "Migrar para pastas · ${{ inputs.repos }}"

# Copia os repositórios antigos por área (silver-caged-<área>,
# silver-rais-<área>, gold-analise-mercado-<área>) para as pastas das áreas em
# silver-caged-area, silver-rais-area e gold-mercado-brasil. Sem refazer
# recorte nem agregação: só baixa e sobe de novo, no caminho novo. Pode rodar
# de novo depois de uma falha: o que já foi copiado é pulado. Não apaga nada.
# Os repositórios do TCC (-ti) não entram.

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositórios antigos separados por espaço (vazio = todos os de área)"
        default: ""

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.lista.outputs.repos }}
    steps:
      - id: lista
        run: |
          if [ -n "${{ inputs.repos }}" ]; then
            LISTA="${{ inputs.repos }}"
          else
            # Os de área que existem no Hub, menos os do TCC (-ti).
            LISTA=$(curl -s "https://huggingface.co/api/datasets?author=Gianpedro&limit=500" \
              | python3 -c "import json,sys,re; print(' '.join(sorted(x['id'].split('/')[1] for x in json.load(sys.stdin) if re.fullmatch(r'(silver-(caged|rais)|gold-analise-mercado)-[a-z]+', x['id'].split('/')[1]) and not x['id'].endswith('-ti'))))")
          fi
          echo "repos=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split()))" "$LISTA")" >> "$GITHUB_OUTPUT"
          echo "$LISTA" | tr ' ' '\n'

  migrar:
    needs: listar
    name: "Migrar ${{ matrix.repo }}"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STAGING_DIR: /mnt/staging
    strategy:
      fail-fast: false
      # Poucos de cada vez: os da mesma camada escrevem no mesmo repositório,
      # e o Hub limita os commits por hora de cada um.
      max-parallel: 3
      matrix:
        repo: ${{ fromJson(needs.listar.outputs.repos) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python

      - name: Staging no disco grande do runner
        run: sudo mkdir -p /mnt/staging && sudo chown -R "$USER" /mnt/staging

      - name: Copia ${{ matrix.repo }}
        working-directory: tasks-python
        run: python _utils/migrar_para_pastas.py --origem ${{ matrix.repo }}
