name: Pipeline · CAGED + RAIS
run-name: "CAGED + RAIS · ${{ inputs.area }} · desde ${{ inputs.comecar_em }}"

# CAGED e RAIS juntos, de ponta a ponta, só manual: para montar uma área nova,
# refazer uma área inteira ou, com "todas", carregar as 10 de uma vez. A
# atualização do dia a dia é dos dois Pipelines, que rodam sozinhos.
#
#   bronze-caged ┐
#   bronze-rais  ┼─ comuns a todas as áreas
#   dicionario   ┘
#        │
#   silver-caged-completa ┐  a base inteira traduzida, de onde toda área
#   silver-rais-completa  ┘  recorta
#        │
#   silver das áreas, CAGED e RAIS (silver-areas.yml): cada tabela/ano da
#   completa é baixado UMA vez e recortado para todas as áreas pedidas
#        │
#   gold, 2 áreas por vez (area-carga.yml): RAIS, CAGED, território (as
#   duas partes) e modelos. Com "recentes" (o padrão), só os anos novos de
#   cada tabela; o que ainda não foi publicado é feito inteiro sozinho.
#
# Tudo publica no repositório da área, Gianpedro/mercadobrasil-<área>, cada
# camada na sua pasta (silver-caged-<área>/, silver-rais-<área>/, gold-<área>/).

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área do recorte (todas = as 10, numa passada só na silver)"
        type: choice
        options: ["escolha a área", todas, tec, saude, educacao, agronegocio, financas, industria, construcao, logistica, comercio, engenharia]
        default: "escolha a área"
        required: true
      comecar_em:
        description: "bronze = tudo; silver completa = pula a bronze; silver área = só as áreas; gold = refaz a gold sem verificar a silver"
        type: choice
        options: [bronze, "silver completa", "silver área", gold]
        default: "silver área"
      anos_gold:
        description: "Anos da gold: recentes (só os novos, mesclados com a gold publicada) ou todos"
        type: choice
        options: [recentes, todos]
        default: recentes
      ano_inicio:
        description: "Ano inicial para bronze/silver (vazio = padrão de cada etapa)"
      ano_fim:
        description: "Ano final para bronze/silver (vazio = ano atual)"

jobs:
  decidir:
    name: "Decidir camadas · ${{ inputs.area }}"
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.calc.outputs.areas }}
      areas_texto: ${{ steps.calc.outputs.areas_texto }}
      bronze: ${{ steps.calc.outputs.bronze }}
      completa: ${{ steps.calc.outputs.completa }}
      silver: ${{ steps.calc.outputs.silver }}
    steps:
      - id: calc
        run: |
          AREA="${{ inputs.area }}"
          if [ "$AREA" = "escolha a área" ]; then
            echo "::error::Escolha a área no menu antes de rodar."
            exit 1
          fi
          # As mesmas áreas do menu (e de tasks-python/_utils/areas.py).
          [ "$AREA" = todas ] && TEXTO="tec saude educacao agronegocio financas industria construcao logistica comercio engenharia" || TEXTO="$AREA"
          echo "areas_texto=$TEXTO" >> "$GITHUB_OUTPUT"
          echo "areas=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$TEXTO")" >> "$GITHUB_OUTPUT"
          COMECAR="${{ inputs.comecar_em }}"
          echo "bronze=$([ "$COMECAR" = bronze ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "completa=$(case "$COMECAR" in bronze|"silver completa") echo true;; *) echo false;; esac)" >> "$GITHUB_OUTPUT"
          echo "silver=$([ "$COMECAR" = gold ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "Áreas: $TEXTO | começando em: $COMECAR"

  bronze-caged:
    needs: decidir
    if: needs.decidir.outputs.bronze == 'true'
    uses: ./.github/workflows/bronze-caged.yml
    with:
      ano_inicio: ${{ inputs.ano_inicio }}
      ano_fim: ${{ inputs.ano_fim }}
    secrets: inherit

  bronze-rais:
    needs: decidir
    if: needs.decidir.outputs.bronze == 'true'
    uses: ./.github/workflows/bronze-rais.yml
    with:
      ano_inicio: ${{ inputs.ano_inicio }}
      ano_fim: ${{ inputs.ano_fim }}
    secrets: inherit

  dicionario:
    needs: decidir
    if: needs.decidir.outputs.bronze == 'true'
    uses: ./.github/workflows/dicionario.yml
    secrets: inherit

  silver-caged-completa:
    needs: [decidir, bronze-caged, dicionario]
    if: needs.decidir.outputs.completa == 'true' && !failure() && !cancelled()
    uses: ./.github/workflows/silver-caged-completa.yml
    with:
      ano_inicio: ${{ inputs.ano_inicio }}
      ano_fim: ${{ inputs.ano_fim }}
    secrets: inherit

  silver-rais-completa:
    needs: [decidir, bronze-rais, dicionario]
    if: needs.decidir.outputs.completa == 'true' && !failure() && !cancelled()
    uses: ./.github/workflows/silver-rais-completa.yml
    with:
      ano_inicio: ${{ inputs.ano_inicio }}
      ano_fim: ${{ inputs.ano_fim }}
    secrets: inherit

  silver-areas-caged:
    needs: [decidir, silver-caged-completa]
    if: needs.decidir.outputs.silver == 'true' && !failure() && !cancelled()
    uses: ./.github/workflows/silver-areas.yml
    with:
      base: caged
      areas: ${{ needs.decidir.outputs.areas_texto }}
      ano_inicio: ${{ inputs.ano_inicio }}
      ano_fim: ${{ inputs.ano_fim }}
    secrets: inherit

  silver-areas-rais:
    needs: [decidir, silver-rais-completa]
    if: needs.decidir.outputs.silver == 'true' && !failure() && !cancelled()
    uses: ./.github/workflows/silver-areas.yml
    with:
      base: rais
      areas: ${{ needs.decidir.outputs.areas_texto }}
      ano_inicio: ${{ inputs.ano_inicio }}
      ano_fim: ${{ inputs.ano_fim }}
    secrets: inherit

  gold:
    needs: [decidir, silver-areas-caged, silver-areas-rais]
    if: ${{ !failure() && !cancelled() }}
    name: "Gold · ${{ matrix.area }}"
    strategy:
      fail-fast: false
      # Duas áreas por vez (cada uma com 4 golds em paralelo).
      max-parallel: 2
      matrix:
        area: ${{ fromJson(needs.decidir.outputs.areas) }}
    uses: ./.github/workflows/area-carga.yml
    with:
      area: ${{ matrix.area }}
      anos_gold: ${{ inputs.anos_gold }}
    secrets: inherit
