name: Reprodutibilidade CAGED por área
run-name: "Reprodutibilidade CAGED · ${{ inputs.area }}"

# Conta o recorte da área no microdado bruto (bronze-caged), por tabela e
# ano, e compara com silver-caged-<área>. Como a silver da área sai da
# silver completa, diferença zero prova a cadeia inteira: bronze ->
# completa -> área. Resultado em auditoria/reprodutibilidade_caged.csv na
# gold da área.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área do recorte"
        type: choice
        options: [tec, saude, educacao, agronegocio, financas, industria, construcao, logistica, comercio, engenharia]
        required: true
      anos:
        description: "Anos separados por espaço (vazio = 2007 a 2026)"

env:
  AREA: ${{ inputs.area }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  verificar:
    name: "Recontagem · ${{ inputs.area }}"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-actions.txt

      - name: Recontagem a partir da bronze
        working-directory: tasks-python
        run: |
          ANOS="${{ inputs.anos }}"
          python _utils/reprodutibilidade_caged.py ${ANOS:+--anos $ANOS}
