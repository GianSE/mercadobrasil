name: Etapa · Silver RAIS da área
run-name: "Silver RAIS · ${{ inputs.area }}"

# A silver da área escolhida, em Gianpedro/mercadobrasil-<área>/silver-rais-<área>: recorte da
# silver completa (Gianpedro/silver-rais, já traduzida), sem ler a bronze
# (silver-area.py). Depende da silver-rais-completa.yml estar em dia.
#
# O staging vai para /mnt, o disco grande do runner: um ano da RAIS de uma
# área grande como saúde ou educação passa de 1 GB, e a publicação ainda
# consolida o ano num arquivo só.

on:
  workflow_dispatch:
    inputs:
      area:
        description: "Área do recorte"
        type: choice
        options: ["escolha a área", tec, saude, educacao, agronegocio, financas, industria, construcao, logistica, comercio, engenharia]
        default: "escolha a área"
        required: true
      ano_inicio:
        description: "Ano inicial (vazio = 2007, início do recorte)"
      ano_fim:
        description: "Ano final (vazio = ano atual)"
      forcar:
        description: "Refazer os anos do intervalo mesmo que já estejam na silver da área"
        type: boolean
        default: false
  workflow_call:
    inputs:
      area:
        type: string
        required: true
      ano_inicio:
        type: string
      ano_fim:
        type: string
      forcar:
        type: boolean
        default: false
    outputs:
      tem_novidade:
        description: "true se havia ano ou mês novo para recortar"
        value: ${{ jobs.verificar.outputs.tem_novidade }}

env:
  AREA: ${{ inputs.area }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  verificar:
    name: "Verificar · ${{ inputs.area }}"
    runs-on: ubuntu-latest
    outputs:
      tem_novidade: ${{ steps.chk.outputs.tem_novidade }}
      anos: ${{ steps.chk.outputs.anos }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python

      - id: chk
        working-directory: tasks-python/2-silver
        run: |
          ANO_INICIO="${{ inputs.ano_inicio }}"
          ANO_FIM="${{ inputs.ano_fim }}"
          python silver-area.py --base rais --modo verificar --ano-inicio "${ANO_INICIO:-2007}" --ano-fim "${ANO_FIM:-9999}" ${{ inputs.forcar && '--forcar' || '' }}

  processar:
    name: "${{ inputs.area }} · ${{ matrix.item.tabela }} ${{ matrix.item.ano }}"
    needs: verificar
    if: needs.verificar.outputs.tem_novidade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      STAGING_DIR: /mnt/staging
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        item: ${{ fromJson(needs.verificar.outputs.anos) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/python

      - name: Staging no disco grande do runner
        run: sudo mkdir -p /mnt/staging && sudo chown -R "$USER" /mnt/staging && df -h / /mnt

      - name: Recorta ${{ inputs.area }} de ${{ matrix.item.tabela }} ${{ matrix.item.ano }}
        working-directory: tasks-python/2-silver
        run: |
          python silver-area.py --base rais --modo processar --tabela ${{ matrix.item.tabela }} \
            --ano-inicio ${{ matrix.item.ano }} --ano-fim ${{ matrix.item.ano }}
